name: Prompt example
description: Suggest a workflow that readers could try from their agent chat.
title: "Example: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: What should the agent do?
      description: Describe the goal with a synthetic scenario.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What should the reader see?
      description: Name the expected output and what evidence would verify it.
    validations:
      required: true
