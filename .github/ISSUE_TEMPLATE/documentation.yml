name: Documentation problem
description: Report a broken link, misleading explanation, or unclear prompt.
title: "Docs: "
body:
  - type: input
    id: page
    attributes:
      label: Page or example
      placeholder: Link or page title
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was unclear or incorrect?
      description: Use a sanitized example. Do not include private URLs, credentials, or logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would make it clearer?
