<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 215" role="img" aria-labelledby="title desc">
<title id="title">The Unhooked SDK authoring flow</title><desc id="desc">Prompt, compose skills from reusable blocks, package steps and scripts, and verify in a fresh host.</desc>
<rect width="1280" height="215" rx="16" fill="#0B0B0C"/>
<g font-family="ui-sans-serif, system-ui, sans-serif"><g transform="translate(48 59)"><rect width="272" height="118" rx="12" fill="#18181B" stroke="#3F3F46"/><text x="20" y="30" fill="#A1A1AA" font-family="monospace" font-size="14">01</text><text x="20" y="65" fill="#FAFAF9" font-size="25" font-weight="600">Prompt</text><text x="20" y="93" fill="#A1A1AA" font-size="15">Describe the job and its result</text></g><g transform="translate(352 59)"><rect width="272" height="118" rx="12" fill="#18181B" stroke="#3F3F46"/><text x="20" y="30" fill="#A1A1AA" font-family="monospace" font-size="14">02</text><text x="20" y="65" fill="#FAFAF9" font-size="25" font-weight="600">Compose</text><text x="20" y="93" fill="#A1A1AA" font-size="15">Reuse blocks and author steps</text></g><g transform="translate(656 59)"><rect width="272" height="118" rx="12" fill="#18181B" stroke="#3F3F46"/><text x="20" y="30" fill="#A1A1AA" font-family="monospace" font-size="14">03</text><text x="20" y="65" fill="#FAFAF9" font-size="25" font-weight="600">Package</text><text x="20" y="93" fill="#A1A1AA" font-size="15">Export workflow and scripts</text></g><g transform="translate(960 59)"><rect width="272" height="118" rx="12" fill="#18181B" stroke="#3F3F46"/><text x="20" y="30" fill="#A1A1AA" font-family="monospace" font-size="14">04</text><text x="20" y="65" fill="#FAFAF9" font-size="25" font-weight="600">Verify</text><text x="20" y="93" fill="#A1A1AA" font-size="15">Run a fixed case in a fresh host</text></g></g>
